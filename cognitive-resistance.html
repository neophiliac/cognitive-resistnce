<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cognitive Resistance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Cognitive Resistance</p>
  <h1>Ask something. Then watch it get checked.</h1>
  <p class="lede">Every answer here gets a second, adversarial pass — Claude auditing Claude, with a web search, before you're allowed to just <em>believe it</em>.</p>

  <form id="askForm">
    <textarea id="promptInput" placeholder="Ask anything — a fact, a claim, a recommendation…" required></textarea>
    <div class="form-row">
      <span class="hint" id="hintText">nothing here is trusted by default</span>
      <button type="submit" id="submitBtn">Ask</button>
    </div>
  </form>

  <div id="results"></div>
</div>

<script src="script.js"></script>
</body>
</html>
