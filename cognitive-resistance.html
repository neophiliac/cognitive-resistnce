<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cognitive Resistance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ECE7DB;
    --surface: #F7F4EA;
    --surface-raised: #FBF9F2;
    --ink: #2A2722;
    --ink-muted: #857D6C;
    --accent: #BD5A2A;
    --rule: #DBD3BF;
    --verified: #5B7A54;
    --contestable: #B08A2E;
    --unverifiable: #B04A2E;
    --opinion: #756D5C;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 760px;
    margin: 0 auto;
    padding: clamp(28px, 6vw, 64px) 24px 80px;
  }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 14px;
  }
  h1{
    font-family: 'Source Serif 4', serif;
    font-weight: 500;
    font-size: clamp(32px, 5.5vw, 46px);
    line-height: 1.08;
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }
  .lede{
    color: var(--ink-muted);
    font-size: 16px;
    line-height: 1.6;
    max-width: 56ch;
    margin: 0 0 40px;
  }
  .lede em{
    color: var(--ink);
    font-style: normal;
    border-bottom: 1.5px solid var(--accent);
  }

  form{
    background: var(--surface);
    border-top: 3px solid var(--accent);
    border-radius: 4px;
    padding: 22px;
    box-shadow: 0 1px 2px rgba(42,39,34,0.04);
  }
  textarea{
    width: 100%;
    min-height: 84px;
    resize: vertical;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: var(--surface-raised);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 14px;
    outline: none;
    transition: border-color .15s ease;
  }
  textarea:focus{ border-color: var(--accent); }
  textarea::placeholder{ color: var(--ink-muted); }

  .form-row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 14px;
  }
  .hint{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-muted);
    letter-spacing: 0.02em;
  }
  button{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: var(--accent);
    color: var(--surface-raised);
    border: none;
    border-radius: 3px;
    padding: 11px 22px;
    cursor: pointer;
    transition: opacity .15s ease, transform .1s ease;
  }
  button:hover:not(:disabled){ opacity: 0.88; }
  button:active:not(:disabled){ transform: translateY(1px); }
  button:disabled{ opacity: 0.5; cursor: default; }

  .status{
    display:flex;
    align-items:center;
    gap: 10px;
    margin: 28px 2px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-muted);
    opacity:0;
    animation: fadein .3s ease forwards;
  }
  .spinner{
    width: 13px; height: 13px;
    border-radius: 50%;
    border: 2px solid var(--rule);
    border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  @keyframes fadein{ to{ opacity:1; } }

  .panel{
    margin-top: 34px;
    opacity: 0;
    animation: rise .45s ease forwards;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .panel-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 10px;
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .panel-label .n{
    width: 18px; height:18px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--surface);
    font-size: 10px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }

  .answer-box{
    background: var(--surface-raised);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 20px 22px;
    font-size: 15.5px;
    line-height: 1.65;
    white-space: pre-wrap;
  }

  .gauge-card{
    background: var(--ink);
    color: var(--surface);
    border-radius: 4px;
    padding: 22px 24px;
    margin-bottom: 20px;
  }
  .gauge-top{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 12px;
  }
  .gauge-stat{
    font-family: 'Source Serif 4', serif;
    font-size: 30px;
    line-height:1;
  }
  .gauge-verdict{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: right;
  }
  .gauge-bar{
    display:flex;
    gap: 3px;
    height: 8px;
    border-radius: 2px;
    overflow: hidden;
  }
  .gauge-seg{ flex:1; background: rgba(247,244,234,0.15); }
  .gauge-seg.fill{ background: var(--accent); }
  .gauge-caption{
    margin-top: 10px;
    font-size: 13px;
    color: rgba(247,244,234,0.7);
    line-height:1.5;
  }

  .claim{
    border-left: 3px solid var(--rule);
    padding: 4px 0 4px 16px;
    margin-bottom: 16px;
    opacity: 0;
    animation: rise .4s ease forwards;
  }
  .claim.verified{ border-color: var(--verified); }
  .claim.contestable{ border-color: var(--contestable); }
  .claim.unverifiable{ border-color: var(--unverifiable); }
  .claim.opinion{ border-color: var(--opinion); }

  .claim-top{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom: 5px;
  }
  .tag{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 20px;
  }
  .tag.verified{ background: rgba(91,122,84,0.15); color: var(--verified); }
  .tag.contestable{ background: rgba(176,138,46,0.15); color: var(--contestable); }
  .tag.unverifiable{ background: rgba(176,74,46,0.15); color: var(--unverifiable); }
  .tag.opinion{ background: rgba(117,109,92,0.15); color: var(--opinion); }

  .claim-text{
    font-size: 14.5px;
    line-height: 1.55;
    margin: 0 0 4px;
  }
  .claim-note{
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--ink-muted);
    margin: 0;
  }
  .claim-check{
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
    margin: 6px 0 0;
    font-family: 'IBM Plex Mono', monospace;
  }
  .claim-check::before{ content: "→ "; color: var(--accent); }

  .footer-quote{
    margin-top: 44px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    display:flex;
    gap: 14px;
  }
  .footer-quote .bar{ width:3px; background: var(--accent); flex-shrink:0; border-radius:2px; }
  .footer-quote p{
    color: var(--ink-muted);
    font-size: 14px;
    line-height: 1.6;
    margin: 0;
  }

  .error-box{
    background: rgba(176,74,46,0.08);
    border: 1px solid rgba(176,74,46,0.25);
    color: var(--unverifiable);
    border-radius: 4px;
    padding: 14px 16px;
    font-size: 14px;
    margin-top: 20px;
  }

  .reset-link{
    display:inline-block;
    margin-top: 28px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-muted);
    text-decoration: underline;
    cursor: pointer;
    background:none; border:none; padding:0;
  }
  .reset-link:hover{ color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Cognitive Resistance</p>
  <h1>Ask something. Then watch it get checked.</h1>
  <p class="lede">Every answer here gets a second, adversarial pass — Claude auditing Claude, with a web search, before you're allowed to just <em>believe it</em>.</p>

  <form id="askForm">
    <textarea id="promptInput" placeholder="Ask anything — a fact, a claim, a recommendation…" required></textarea>
    <div class="form-row">
      <span class="hint" id="hintText">nothing here is trusted by default</span>
      <button type="submit" id="submitBtn">Ask</button>
    </div>
  </form>

  <div id="results"></div>
</div>

<script>
const form = document.getElementById('askForm');
const input = document.getElementById('promptInput');
const btn = document.getElementById('submitBtn');
const results = document.getElementById('results');
const hint = document.getElementById('hintText');

const TIER_LABEL = {
  verified: 'Verified',
  contestable: 'Contestable',
  unverifiable: 'Unverifiable',
  opinion: 'Opinion as fact'
};

function esc(str){
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}

function statusEl(text){
  const el = document.createElement('div');
  el.className = 'status';
  el.innerHTML = `<div class="spinner"></div><span>${esc(text)}</span>`;
  return el;
}

async function callClaude(messages, tools){
  const body = {
    model: "claude-sonnet-4-6",
    max_tokens: 1200,
    messages
  };
  if (tools) body.tools = tools;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error("API request failed (" + res.status + ")");
  const data = await res.json();
  const text = (data.content || [])
    .filter(b => b.type === "text")
    .map(b => b.text)
    .join("\n")
    .trim();
  return text;
}

function parseAudit(raw){
  let cleaned = raw.replace(/```json/gi, '').replace(/```/g, '').trim();
  const firstBrace = cleaned.indexOf('{');
  const lastBrace = cleaned.lastIndexOf('}');
  if (firstBrace !== -1 && lastBrace !== -1) {
    cleaned = cleaned.slice(firstBrace, lastBrace + 1);
  }
  return JSON.parse(cleaned);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  btn.disabled = true;
  hint.textContent = 'working…';
  results.innerHTML = '';

  const s1 = statusEl('Sending your question to Claude…');
  results.appendChild(s1);

  try {
    const answer = await callClaude([{ role: "user", content: question }]);

    s1.remove();
    const answerPanel = document.createElement('div');
    answerPanel.className = 'panel';
    answerPanel.innerHTML = `
      <div class="panel-label"><span class="n">1</span>What Claude said</div>
      <div class="answer-box">${esc(answer)}</div>
    `;
    results.appendChild(answerPanel);

    const s2 = statusEl('Auditing that answer — checking claims against the web…');
    results.appendChild(s2);

    const auditPrompt = `You are a skeptical fact-checking auditor reviewing an AI-generated answer. Be genuinely adversarial — do not rubber-stamp claims. Use web search to check specific, checkable claims.

ORIGINAL QUESTION:
${question}

ANSWER TO AUDIT:
${answer}

Break the answer into its distinct factual or evaluative claims (skip pure filler/pleasantries). For each claim, assign exactly one tier:
- "verified": checked against a real source and confirmed
- "contestable": reasonable people or sources disagree, or it depends on unstated context
- "unverifiable": no way to confirm this from available sources, too vague, or a future prediction
- "opinion": stated as fact but is actually a judgment call or value claim

Respond with ONLY raw JSON, no markdown fences, no preamble, in exactly this shape:
{
  "summary": "one blunt sentence on how much of this answer should be trusted as-is",
  "claims": [
    {"text": "short paraphrase of the claim, under 20 words", "tier": "verified|contestable|unverifiable|opinion", "note": "one sentence on why", "check": "a concrete way to verify it yourself, or null if tier is verified"}
  ]
}

If the answer has no meaningful factual claims (e.g. it's creative writing or a simple greeting), return an empty claims array and say so in the summary.`;

    const auditRaw = await callClaude(
      [{ role: "user", content: auditPrompt }],
      [{ type: "web_search_20250305", name: "web_search" }]
    );

    s2.remove();

    let audit;
    try {
      audit = parseAudit(auditRaw);
    } catch (parseErr) {
      const fallback = document.createElement('div');
      fallback.className = 'panel';
      fallback.innerHTML = `
        <div class="panel-label"><span class="n">2</span>Under its own scrutiny</div>
        <div class="answer-box">${esc(auditRaw)}</div>
      `;
      results.appendChild(fallback);
      hint.textContent = 'nothing here is trusted by default';
      btn.disabled = false;
      return;
    }

    const claims = audit.claims || [];
    const total = claims.length;
    const shaky = claims.filter(c => c.tier !== 'verified').length;
    const verdict = total === 0 ? 'no checkable claims'
      : shaky === 0 ? 'holds up'
      : shaky === total ? 'mostly unconfirmed'
      : 'mixed';

    const auditPanel = document.createElement('div');
    auditPanel.className = 'panel';

    let gaugeHtml = '';
    if (total > 0) {
      const segs = Array.from({length: total}, (_, i) =>
        `<div class="gauge-seg ${i < shaky ? 'fill' : ''}"></div>`
      ).join('');
      gaugeHtml = `
        <div class="gauge-card">
          <div class="gauge-top">
            <div class="gauge-stat">${shaky} of ${total} claims need a second look</div>
            <div class="gauge-verdict">${esc(verdict)}</div>
          </div>
          <div class="gauge-bar">${segs}</div>
          <p class="gauge-caption">${esc(audit.summary || '')}</p>
        </div>
      `;
    } else {
      gaugeHtml = `
        <div class="gauge-card">
          <div class="gauge-top">
            <div class="gauge-stat">Nothing to check</div>
            <div class="gauge-verdict">${esc(verdict)}</div>
          </div>
          <p class="gauge-caption">${esc(audit.summary || '')}</p>
        </div>
      `;
    }

    const claimsHtml = claims.map((c, i) => {
      const tier = ['verified','contestable','unverifiable','opinion'].includes(c.tier) ? c.tier : 'contestable';
      return `
        <div class="claim ${tier}" style="animation-delay:${0.05 * i}s">
          <div class="claim-top"><span class="tag ${tier}">${TIER_LABEL[tier]}</span></div>
          <p class="claim-text">${esc(c.text)}</p>
          <p class="claim-note">${esc(c.note || '')}</p>
          ${c.check ? `<p class="claim-check">${esc(c.check)}</p>` : ''}
        </div>
      `;
    }).join('');

    auditPanel.innerHTML = `
      <div class="panel-label"><span class="n">2</span>Under its own scrutiny</div>
      ${gaugeHtml}
      ${claimsHtml}
    `;
    results.appendChild(auditPanel);

    const footer = document.createElement('div');
    footer.className = 'footer-quote';
    footer.innerHTML = `
      <div class="bar"></div>
      <p>This second pass is still Claude — it can miss things or be wrong too. Treat it as a prompt to go check, not a verdict.</p>
    `;
    results.appendChild(footer);

    const resetBtn = document.createElement('button');
    resetBtn.className = 'reset-link';
    resetBtn.textContent = 'Ask something else';
    resetBtn.onclick = () => { results.innerHTML = ''; input.value=''; input.focus(); };
    results.appendChild(resetBtn);

    hint.textContent = 'nothing here is trusted by default';
    btn.disabled = false;

  } catch (err) {
    s1.remove();
    const errEl = document.createElement('div');
    errEl.className = 'error-box';
    errEl.textContent = 'Something went wrong: ' + err.message;
    results.appendChild(errEl);
    hint.textContent = 'nothing here is trusted by default';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
